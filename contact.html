<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact — Zaykaveda</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main><section><div class="wrap split" style="align-items:start">
  <div class="prose"><p class="eyebrow">Contact</p><h1 style="font-size:clamp(2.2rem,5vw,3.6rem);margin:8px 0">Say hello to Zaykaveda</h1>
    <p>Questions, feedback, party orders or a table booking? Send a message and the owner will reply personally.</p>
    <div class="card" style="margin-top:24px"><div class="line"><div><small>Owner</small><br><strong>Arish Shah</strong></div></div>
      <div class="line"><div><small>WhatsApp</small><br><strong>+91 96692 19030</strong></div><a class="btn btn-primary btn-sm wa-inline" id="waBtn" target="_blank" rel="noopener" href="#"></a></div>
      <div class="line" style="border:0"><div><small>Hours</small><br><strong>Every day, 11:00 AM – 11:00 PM</strong></div></div></div>
  </div>
  <form class="card form" id="f"><h3>Send a message</h3>
    <div><label>Your name</label><input class="input" name="name" required maxlength="80" autocomplete="name"></div>
    <div class="two"><div><label>Email (optional)</label><input class="input" type="email" name="email" maxlength="120" autocomplete="email"></div>
      <div><label>Phone (optional)</label><input class="input" name="phone" maxlength="20" inputmode="tel" autocomplete="tel"></div></div>
    <div><label>Message</label><textarea name="message" rows="5" required minlength="3" maxlength="2000"></textarea></div>
    <div id="out"></div>
    <button class="btn btn-primary" id="send">Send message</button>
  </form>
</div></section></main>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
Z.init("contact.html");
const b = document.getElementById("waBtn"); b.innerHTML = Z.waSvg + " Chat now";
const setB = () => b.href = Z.waLink("Hello Arish, I have a question about Zaykaveda."); setB(); Z.onConfig = setB;
document.getElementById("f").onsubmit = async e => {
  e.preventDefault(); const btn = document.getElementById("send"), out = document.getElementById("out");
  btn.disabled = true; btn.textContent = "Sending…";
  try {
    await Z.api("/api/contact", { method: "POST", body: Object.fromEntries(new FormData(e.target)) });
    out.innerHTML = '<div class="alert ok">Thank you! Your message has reached the owner.</div>'; e.target.reset();
  } catch (err) { out.innerHTML = `<div class="alert err">${Z.esc(err.message)}</div>`; }
  btn.disabled = false; btn.textContent = "Send message";
};
</script>
</body>
</html>
