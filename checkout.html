<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout — Zaykaveda</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<main><section><div class="wrap">
  <p class="eyebrow">Checkout</p><h1 style="font-size:clamp(2rem,5vw,3.2rem);margin:8px 0 28px">Almost there</h1>
  <div id="view"></div>
</div></section></main>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
Z.init("");
const view = document.getElementById("view");
const buyNow = new URLSearchParams(location.search).get("buy") === "1";
const SAVED = "zv_order";

function getItems() {
  if (buyNow) { try { return JSON.parse(sessionStorage.getItem("zv_buy")) || []; } catch { return []; } }
  return Z.cart.get();
}
const itemsTotal = it => it.reduce((s, x) => s + x.price * x.qty, 0);
const getSaved = () => { try { return JSON.parse(localStorage.getItem(SAVED)); } catch { return null; } };
const setSaved = o => { try { localStorage.setItem(SAVED, JSON.stringify(o)); } catch {} };

/* ---------------- step 1: details ---------------- */
function stepDetails() {
  const items = getItems();
  if (!items.length) {
    const s = getSaved();
    if (s) return stepStatus(s);
    view.innerHTML = '<div class="card empty">Your cart is empty.<br><a class="btn btn-primary" href="menu.html" style="margin-top:14px">Browse the menu</a></div>'; return;
  }
  view.innerHTML = `<div class="checkout">
    <form class="card form" id="f">
      <h3>Your details</h3>
      <div class="two"><div><label>Full name</label><input class="input" name="name" required maxlength="80" autocomplete="name"></div>
        <div><label>Phone number</label><input class="input" name="phone" required inputmode="numeric" pattern="[0-9+ ]{10,14}" placeholder="10-digit mobile" autocomplete="tel"></div></div>
      <div><label>Delivery address / table number (optional)</label><textarea name="address" rows="2" maxlength="300" placeholder="Leave empty for takeaway"></textarea></div>
      <div><label>Note for the kitchen (optional)</label><input class="input" name="note" maxlength="300" placeholder="Less spicy, no onion…"></div>
      <div id="err"></div>
      <button class="btn btn-primary" id="go">Continue to UPI payment</button>
    </form>
    <div class="card"><h3>Order summary</h3>
      ${items.map(x => `<div class="line"><div><strong>${Z.esc(x.name)}</strong><br><small>${x.qty} × ${Z.rs(x.price)}</small></div><b>${Z.rs(x.qty * x.price)}</b></div>`).join("")}
      <div class="total" style="margin:16px 0 0"><span>Total</span><span>${Z.rs(itemsTotal(items))}</span></div>
      <p style="color:var(--muted);font-size:.82rem;margin-top:8px">The final amount is calculated by the restaurant from current menu prices.</p></div></div>`;
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target)); const btn = document.getElementById("go");
    btn.disabled = true; btn.textContent = "Placing order…";
    try {
      const r = await Z.api("/api/orders", { method: "POST", body: { ...fd, items: items.map(x => ({ id: x.id, qty: x.qty })) } });
      const saved = { id: r.order_id, total: r.total, phone: fd.phone.replace(/\D/g, "").slice(-10), name: fd.name };
      setSaved(saved);
      if (buyNow) sessionStorage.removeItem("zv_buy"); else Z.cart.clear();
      history.replaceState(null, "", "checkout.html");
      stepPay(saved);
    } catch (err) {
      document.getElementById("err").innerHTML = `<div class="alert err">${Z.esc(err.message)}</div>`;
      btn.disabled = false; btn.textContent = "Continue to UPI payment";
    }
  };
}

/* ---------------- step 2: pay ---------------- */
function stepPay(o) {
  const upi = Z.cfg.upi_id, name = Z.cfg.upi_name;
  const link = `upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(name)}&am=${o.total.toFixed(2)}&cu=INR&tn=${encodeURIComponent("Zaykaveda order #" + o.id)}`;
  view.innerHTML = `<div class="checkout">
    <div class="card upi-box">
      <p class="eyebrow">Order #${o.id}</p><h3 style="margin:6px 0">Pay ${Z.rs(o.total)} with UPI</h3>
      <div class="qrbox" id="qr"></div>
      <p style="color:var(--muted);font-size:.88rem">Scan with GPay, PhonePe, Paytm, BHIM or any UPI app</p>
      <p style="margin:12px 0 4px;font-size:.85rem;color:var(--muted)">UPI ID</p><span class="upi-id">${Z.esc(upi)}</span>
      <div style="margin-top:16px"><a class="btn btn-primary" href="${link}" id="openApp">Open UPI app on this phone</a></div>
      <ol class="steps"><li>Pay exactly <b>${Z.rs(o.total)}</b>.</li><li>Copy the <b>UPI reference / UTR number</b> (12 digits) from the payment success screen.</li><li>Enter it on the right and submit. The owner will verify and confirm your order.</li></ol>
    </div>
    <form class="card form" id="pf"><h3>I have paid</h3>
      <div><label>UPI reference / UTR number</label><input class="input" name="utr" required minlength="6" maxlength="30" placeholder="e.g. 412345678901" inputmode="text"></div>
      <div id="err"></div>
      <button class="btn btn-primary">Submit payment details</button>
      <p style="color:var(--muted);font-size:.84rem">Payment is verified manually by the restaurant — usually within a few minutes during opening hours. Keep your order number <b>#${o.id}</b>.</p>
      <a class="btn btn-ghost btn-sm wa-inline" target="_blank" rel="noopener" href="${Z.waLink("Hi, I paid for order #" + o.id + " (" + Z.rs(o.total) + ")")}">${Z.waSvg} Message the owner on WhatsApp</a>
    </form></div>`;
  if (window.QRCode) new QRCode(document.getElementById("qr"), { text: link, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M });
  document.getElementById("pf").onsubmit = async e => {
    e.preventDefault();
    try {
      await Z.api(`/api/orders/${o.id}/payment`, { method: "POST", body: { utr: new FormData(e.target).get("utr"), phone: o.phone } });
      stepStatus(o);
    } catch (err) { document.getElementById("err").innerHTML = `<div class="alert err">${Z.esc(err.message)}</div>`; }
  };
}

/* ---------------- step 3: status ---------------- */
let timer;
async function stepStatus(o) {
  clearInterval(timer);
  const draw = async () => {
    let d;
    try { d = await Z.api(`/api/orders/${o.id}?phone=${o.phone}`); }
    catch (e) { view.innerHTML = `<div class="card"><div class="alert err">${Z.esc(e.message)}</div></div>`; clearInterval(timer); return; }
    const msg = {
      unpaid: ["info", "Waiting for your payment. Pay by UPI, then submit the reference number."],
      submitted: ["info", "Thanks! The owner is verifying your payment. This page updates automatically."],
      approved: ["ok", "Payment received. Your order is confirmed!"],
      denied: ["err", "We could not find your payment, so the order was cancelled. If you paid, message us on WhatsApp with your screenshot."],
    }[d.payment_status];
    view.innerHTML = `<div class="checkout"><div class="card">
      <p class="eyebrow">Order #${d.id}</p><h3 style="margin:6px 0 14px">Order status</h3>
      <p>Payment: <span class="status s-${d.payment_status}">${d.payment_status}</span> &nbsp; Order: <span class="status s-${d.order_status}">${d.order_status}</span></p>
      <div class="alert ${msg[0]}" style="margin-top:16px">${msg[1]}</div>
      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
        ${d.payment_status === "unpaid" ? '<button class="btn btn-primary btn-sm" id="payAgain">Pay now</button>' : ""}
        <a class="btn btn-ghost btn-sm" href="menu.html">Order more</a>
        <button class="btn btn-ghost btn-sm" id="clr">Done</button></div></div>
      <div class="card"><h3>Items</h3>${d.items.map(x => `<div class="line"><div><strong>${Z.esc(x.name)}</strong><br><small>${x.qty} × ${Z.rs(x.price)}</small></div><b>${Z.rs(x.qty * x.price)}</b></div>`).join("")}
        <div class="total" style="margin:14px 0 0"><span>Total</span><span>${Z.rs(d.total)}</span></div></div></div>`;
    const pa = document.getElementById("payAgain"); if (pa) pa.onclick = () => { clearInterval(timer); stepPay(o); };
    document.getElementById("clr").onclick = () => { localStorage.removeItem(SAVED); location.href = "index.html"; };
    if (["approved", "denied"].includes(d.payment_status) && ["completed", "cancelled"].includes(d.order_status)) clearInterval(timer);
  };
  await draw();
  timer = setInterval(draw, 8000);
}

/* Wait for owner config (UPI id) before showing the pay step */
Z.api("/api/config").then(c => { Z.cfg = { ...Z.cfg, ...c }; }).catch(() => {}).finally(() => {
  const s = getSaved();
  const items = getItems();
  if (!items.length && s) stepStatus(s); else stepDetails();
});
</script>
</body>
</html>
